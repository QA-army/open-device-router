# Vendor-documented facts as of checked_at. Schema: schema/provider.schema.json
id: github-actions
name: GitHub-hosted runners
status: launch
checked_at: '2026-11-22'
homepage: https://docs.github.com/en/actions
surfaces:
  - ios-simulator
  - android-emulator
  - desktop-browser
hands:
  kind: agent-device
  requires:
    - macOS runner for iOS Simulator
    - Linux runner with KVM for Android emulator
  source: https://github.com/callstack/agent-device
  notes: The job runs on the runner, so agent-device talks to a simulator or emulator on the same machine.
signup:
  required: false
  evidence:
    - not_applicable
  notes: Uses the GitHub account that already owns the repository.
credentials:
  kind: none
  acquire: none
  notes: Jobs use the repository's own GITHUB_TOKEN.
allowances:
  - type: public_repo
    unit: unlimited
    scope: Standard GitHub-hosted runners on public repositories. Larger runners are billed.
    source: https://docs.github.com/en/actions/concepts/billing-and-usage
    notes: Private repositories get a monthly minute quota by plan instead. Concurrency limits by plan
      are in the GitHub usage-limits docs.
    overage: not_applicable
policy:
  max_accounts_per_org: 1
  benchmark_publication: unknown
  third_party_access: restricted
  terms_url: https://docs.github.com/en/site-policy/github-terms/github-terms-for-additional-products-and-features
  terms_checked_note: Actions section read 2026-11-22.
  notes: Hosted runners may not be used for activity "unrelated to the production, testing,
    deployment, or publication of the software project associated with the repository", nor for "the
    provision of a stand-alone or integrated application or service offering the Actions product".
    Route only a repository's own tests here. Do not resell runner time.
sources:
  - https://docs.github.com/en/actions/concepts/billing-and-usage
  - https://docs.github.com/en/site-policy/github-terms/github-terms-for-additional-products-and-features
  - https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners
profiles:
  - id: gha-macos15-iphone17-26-2
    platform: ios
    kind: simulator
    model: iPhone 17
    os: '26.2'
    evidence: observed
    observed_at: '2026-11-22'
    source: https://github.com/QA-army/open-device-router/actions/runs/45078316652
    notes: macos-15 runner with Xcode 16.4 selected.
  - id: gha-ubuntu-pixel6-api34
    platform: android
    kind: emulator
    model: pixel_6
    os: '14'
    provider_device: odr_pixel_6
    evidence: observed
    observed_at: '2026-11-22'
    source: https://github.com/QA-army/open-device-router/actions/runs/45078316652
    notes: ubuntu-24.04 runner with KVM, system image android-34 google_apis x86_64, AVD created by the job as odr_pixel_6 (see .github/workflows/bench-sessions.yml).
control:
  driver: agent-device
  package: agent-device
  min_version: 0.21.0
  inputs:
    - screenshot
    - tap
    - type
    - swipe
    - key
    - install
    - launch
  keys:
    - enter
    - home
    - back
  screenshot: whole_session
  build_formats:
    - apk
    - app
    - app-zip
  install: after_allocation
  closure_check: driver
  max_session_minutes: 360
  evidence: vendor-documented
  source: https://docs.github.com/en/actions/reference/limits
  notes: Same driver as local, run inside the job. 360 minutes is GitHub's job time limit.
