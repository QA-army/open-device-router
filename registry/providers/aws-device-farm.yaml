# Vendor-documented facts as of checked_at. Schema: schema/provider.schema.json
id: aws-device-farm
name: AWS Device Farm
status: launch
checked_at: '2026-11-26'
homepage: https://aws.amazon.com/device-farm/
surfaces:
  - android-real
  - ios-real
hands:
  kind: agent-device
  provider_id: aws-device-farm
  env:
    - AWS_DEVICE_FARM_PROJECT_ARN
  requires:
    - AWS CLI with a working credential chain
  source: https://docs.aws.amazon.com/devicefarm/latest/developerguide/remote-access.html
  notes: Remote-access sessions for Android and iOS. odr creates the session through the Device Farm
    API (METERED billing) and stops it on every exit. Pixel input is not started unless an interactor
    is attached, so a metered session is not opened and then abandoned. The project ARN is not a
    secret; credential values stay in the AWS credential chain.
signup:
  required: true
  url: https://signin.aws.amazon.com/signup?request_type=register
  evidence:
    - live_page
    - docs
  sso: []
  fields:
    - name: root user email
      required: true
      from: user
    - name: account name
      required: true
      from: agent
    - name: password
      required: true
      from: user
    - name: account type (personal or business)
      required: true
      from: user
    - name: contact details and billing address
      required: true
      from: user
    - name: payment method
      required: true
      from: user
    - name: phone number
      required: true
      from: user
  human_steps:
    - accept_terms
    - email_verification
    - payment_card
    - phone_code
    - captcha_possible
  card_required: true
  phone_required: true
  work_email_required: false
  notes: AWS recommends a shared distribution-list address for the root user. Most teams already have
    an AWS account; connect the existing one.
credentials:
  kind: iam_role
  acquire: iam_role
  env:
    - AWS_REGION
    - AWS_ROLE_ARN
    - AWS_WEB_IDENTITY_TOKEN_FILE
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_SESSION_TOKEN
  source: https://agent-device.dev/docs/aws-device-farm
  notes: Standard AWS credential chain. Prefer short-lived role credentials over long-lived user keys.
    Set AWS_DEVICE_FARM_PROJECT_ARN to the project. A CloudFormation quick-create link that provisions
    a least-privilege role is proposed and not built. `odr reconcile aws-device-farm` sums metered
    device minutes; free-only routing refuses until that figure is fresh.
allowances:
  - type: one_time
    amount: 1000
    unit: device_minute
    max_session_minutes: 150
    scope: Real-device free trial. Does not renew.
    source: https://aws.amazon.com/device-farm/faqs/
    notes: Pricing page, read 2026-11-26, says the first 1,000 minutes are free and that this is a
      one-time trial of 1,000 minutes instead of the standard 250. The FAQ says the same and that
      the trial does not renew. Managed Appium endpoint sessions run up to 150 minutes with a
      5-minute idle timeout.
    overage: bills
    overage_usd_per_minute: 0.17
    overage_source: https://aws.amazon.com/device-farm/pricing/
paid:
  summary: $0.17 per device minute; unmetered plan $250.00 per device slot per month; desktop browser
    testing $0.005 per instance minute.
  source: https://aws.amazon.com/device-farm/pricing/
notes: Desktop browser testing is a separate, billed product with no free allowance listed, so it is
  not a routed surface here.
policy:
  max_accounts_per_org: 1
  benchmark_publication: allowed_with_replication
  third_party_access: unknown
  terms_url: https://aws.amazon.com/service-terms/
  terms_checked_note: Service Terms last updated 2026-11-19, read 2026-11-22.
  notes: Section 1.8 permits benchmarks; anyone who discloses one must include "all information
    necessary to replicate such Benchmark" and accepts that AWS may benchmark their products in
    return.
sources:
  - https://aws.amazon.com/device-farm/faqs/
  - https://aws.amazon.com/device-farm/pricing/
  - https://repost.aws/knowledge-center/create-and-activate-aws-account
  - https://docs.aws.amazon.com/devicefarm/latest/developerguide/appium-endpoint-interaction.html
  - https://aws.amazon.com/service-terms/
  - https://docs.aws.amazon.com/devicefarm/latest/developerguide/remote-access.html
  - https://docs.aws.amazon.com/devicefarm/latest/APIReference/API_CreateRemoteAccessSession.html
  - https://docs.aws.amazon.com/devicefarm/latest/APIReference/API_DeviceMinutes.html
  - https://agent-device.dev/docs/aws-device-farm
profiles:
  - id: aws-any-ios
    platform: ios
    kind: real
    model: '*'
    os: '*'
    evidence: vendor-documented
    source: https://agent-device.dev/docs/device-clouds
    notes: Any device in the Device Farm remote-access pool for the configured project.
  - id: aws-any-android
    platform: android
    kind: real
    model: '*'
    os: '*'
    evidence: vendor-documented
    source: https://agent-device.dev/docs/device-clouds
    notes: Any device in the Device Farm remote-access pool for the configured project.
control:
  driver: aws-device-farm
  inputs:
    - screenshot
    - tap
    - type
    - swipe
    - key
    - install
    - launch
  keys:
    - enter
    - home
    - back
  screenshot: whole_session
  build_formats:
    - apk
    - ipa
  install: upload_before_allocation
  closure_check: provider_api
  usage_api: https://docs.aws.amazon.com/devicefarm/latest/APIReference/API_DeviceMinutes.html
  max_session_minutes: 150
  evidence: vendor-documented
  source: https://docs.aws.amazon.com/devicefarm/latest/developerguide/remote-access.html
  notes: Upload the apk or ipa, create a metered remote-access session, stop it, and delete the upload.
    Closure is GetRemoteAccessSession status COMPLETED. Free-only routing runs only after a fresh
    `odr reconcile aws-device-farm`. Pixel control is refused until an interactor is attached, so
    odr does not open a metered session it cannot drive. Live AWS was not called from CI.
